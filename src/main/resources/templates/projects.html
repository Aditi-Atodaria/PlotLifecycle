<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Projects - Plot Lifecycle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/ventriloc.css">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container mb-5" style="max-width: 1216px;">
    <div class="d-flex justify-content-between align-items-end mb-4 pt-2">
        <div>
            <span class="ventriloc-eyebrow">Development Portfolio</span>
            <h1 class="serif-display mb-1" style="font-size: 44px; font-weight: 400;">Layout Schemes</h1>
            <p class="ventriloc-subtext mb-0">Master-planned real estate communities and parcel holdings.</p>
        </div>
        <button class="btn btn-ventriloc-primary btn-sm" data-bs-toggle="modal" data-bs-target="#newProjectModal"
                sec:authorize="hasRole('ADMIN')">
            + Add New Scheme
        </button>
    </div>

    <div th:if="${error}" class="alert alert-danger py-2 small mb-4" th:text="${error}"></div>

    <div class="row row-cols-1 row-cols-md-2 g-4">
        <div class="col" th:each="p : ${projects}">
            <div class="card p-4 h-100 d-flex flex-column justify-content-between">
                <div>
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <div>
                            <span class="ventriloc-eyebrow" style="font-size: 11px;">Active Scheme</span>
                            <h3 class="serif-heading mb-1" style="font-size: 26px; font-weight: 400;" th:text="${p.name}">Project Name</h3>
                            <p class="ventriloc-subtext small mb-0">
                                📍 <span th:text="${p.location != null ? p.location : 'Location unassigned'}">Location</span>
                            </p>
                        </div>
                        <span class="badge bg-secondary" th:text="${#lists.size(p.sites) + ' units'}">0 units</span>
                    </div>

                    <div class="ventriloc-featured-card p-3 my-3">
                        <div class="row text-center">
                            <div class="col-6 border-end" style="border-color: var(--color-mist) !important;">
                                <div class="ventriloc-subtext small">Total Inventory</div>
                                <div class="serif-stat" style="font-size: 32px; font-weight: 400;" th:text="${#lists.size(p.sites)}">0</div>
                            </div>
                            <div class="col-6">
                                <div class="ventriloc-subtext small">Scheme ID</div>
                                <div class="serif-stat" style="font-size: 32px; font-weight: 400; color: var(--color-ember-orange);" th:text="${'#' + p.id}">#1</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center pt-2">
                    <a th:href="@{'/sites'}" class="btn btn-ventriloc-outline btn-sm">Inspect Plots ➔</a>
                    <form th:action="@{'/projects/' + ${p.id} + '/delete'}" method="post"
                          onsubmit="return confirm('Confirm scheme deletion?');"
                          sec:authorize="hasRole('ADMIN')" class="m-0">
                        <button class="btn btn-slash-danger btn-sm" type="submit">Delete Scheme</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal: New Project -->
<div class="modal fade" id="newProjectModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title serif-heading" style="font-size: 22px; font-weight: 400;">Create Layout Scheme</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/projects}" th:object="${project}" method="post">
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label class="form-label small">Scheme Name</label>
                        <input class="form-control" th:field="*{name}" placeholder="e.g. Palm Meadows Estate" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label small">Location / Jurisdiction</label>
                        <input class="form-control" th:field="*{location}" placeholder="e.g. Sarjapur Road, Bengaluru">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-ventriloc-ghost btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-ventriloc-primary btn-sm">Save Scheme</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
