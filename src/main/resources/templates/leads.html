<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Leads - Plot Lifecycle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/ventriloc.css">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container mb-5" style="max-width: 1216px;">
    <div class="d-flex justify-content-between align-items-end mb-4 pt-2">
        <div>
            <span class="ventriloc-eyebrow">Inbound Pipeline</span>
            <h1 class="serif-display mb-1" style="font-size: 44px; font-weight: 400;">Prospective Leads</h1>
            <p class="ventriloc-subtext mb-0">Capture acquisition signals and transition to buyer agreements.</p>
        </div>
    </div>

    <!-- Capture Lead Card -->
    <div class="card p-4 mb-4">
        <span class="ventriloc-eyebrow" style="font-size: 11px;">Register Inbound Signal</span>
        <form th:action="@{/leads}" th:object="${leadForm}" method="post" class="mt-2">
            <div class="row g-2 mb-2">
                <div class="col-md-3">
                    <label class="form-label small">Prospect Name *</label>
                    <input class="form-control" th:field="*{name}" placeholder="Full Name">
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>
                <div class="col-md-3">
                    <label class="form-label small">Phone Contact *</label>
                    <input class="form-control" th:field="*{phone}" placeholder="+91 98765 43210">
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                </div>
                <div class="col-md-3">
                    <label class="form-label small">Email Address</label>
                    <input class="form-control" th:field="*{email}" placeholder="prospect@example.com">
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="col-md-3">
                    <label class="form-label small">Preferred Scheme</label>
                    <input class="form-control" th:field="*{interestedProject}" placeholder="e.g. Green Valley">
                </div>
            </div>
            <div class="row g-2">
                <div class="col-md-3">
                    <label class="form-label small">Channel Source</label>
                    <select class="form-select" th:field="*{source}">
                        <option th:each="s : ${sources}" th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small">Assigned Sales Agent</label>
                    <select class="form-select" th:field="*{assignedAgent}">
                        <option value="">-- Unassigned --</option>
                        <option th:each="a : ${agents}" th:value="${a.username}" th:text="${a.fullName + ' (' + a.username + ')'}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label small">Acquisition Notes</label>
                    <input class="form-control" th:field="*{notes}" placeholder="e.g. Villa parcel, 6-mo plan preference">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button class="btn btn-ventriloc-primary w-100" type="submit">Log Lead</button>
                </div>
            </div>
        </form>
    </div>

    <!-- Leads Table -->
    <div class="card">
        <div class="table-responsive">
            <table class="table mb-0">
                <thead>
                <tr>
                    <th style="width: 50px;">#</th>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Target Scheme</th>
                    <th>Source</th>
                    <th>Agent</th>
                    <th>Status</th>
                    <th>Date</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="lead : ${leads}">
                    <td class="ventriloc-subtext font-monospace" th:text="${lead.id}"></td>
                    <td class="fw-semibold text-dark" th:text="${lead.name}"></td>
                    <td th:text="${lead.phone}"></td>
                    <td class="ventriloc-subtext small" th:text="${lead.email != null ? lead.email : '-'}"></td>
                    <td th:text="${lead.interestedProject != null ? lead.interestedProject : '-'}"></td>
                    <td><span class="badge bg-secondary" th:text="${lead.source}">WEBSITE</span></td>
                    <td>
                        <span class="badge bg-secondary"
                              th:text="${lead.assignedAgent != null ? lead.assignedAgent : 'Unassigned'}"></span>
                    </td>
                    <td>
                        <span th:if="${lead.status.name() == 'NEW'}" class="badge badge-booked">NEW</span>
                        <span th:if="${lead.status.name() == 'CONVERTED'}" class="badge badge-available">CONVERTED</span>
                        <span th:if="${lead.status.name() != 'NEW' && lead.status.name() != 'CONVERTED'}"
                              class="badge bg-secondary" th:text="${lead.status}"></span>
                    </td>
                    <td class="ventriloc-subtext small" th:text="${lead.createdDate}"></td>
                    <td class="text-end">
                        <div class="d-flex gap-1 justify-content-end">
                            <a th:if="${lead.status.name() != 'CONVERTED'}"
                               class="btn btn-ventriloc-primary btn-sm py-0 px-2"
                               th:href="@{'/leads/' + ${lead.id} + '/convert'}">
                                Convert
                            </a>
                            <form th:action="@{'/leads/' + ${lead.id} + '/delete'}" method="post"
                                  onsubmit="return confirm('Delete lead entry?');" class="m-0">
                                <button class="btn btn-slash-danger btn-sm py-0 px-2" type="submit">×</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(leads)}">
                    <td colspan="10" class="text-center ventriloc-subtext py-4">No prospective leads captured yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
