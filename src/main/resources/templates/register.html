<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Account - Plot Lifecycle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/ventriloc.css">
</head>
<body>
<div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card p-4" style="width: 28rem; border-radius: var(--radius-card-featured) !important;">
        <div class="text-center mb-4">
            <span class="ventriloc-eyebrow">Identity Registry</span>
            <h2 class="serif-heading mb-1" style="font-size: 30px; font-weight: 400;">Create Account</h2>
            <p class="ventriloc-subtext small">Register personnel account with role-based system authorization.</p>
        </div>

        <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>

        <form th:action="@{/register}" th:object="${registerForm}" method="post">
            <div class="mb-3">
                <label class="form-label small">Full Name</label>
                <input type="text" th:field="*{fullName}" class="form-control" placeholder="e.g. Eleanor Vance">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label small">Username</label>
                <input type="text" th:field="*{username}" class="form-control" placeholder="Choose system handle">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label small">Password</label>
                <input type="password" th:field="*{password}" class="form-control" placeholder="Minimum 6 characters">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <div class="mb-4">
                <label class="form-label small">Role Authorization</label>
                <select th:field="*{role}" class="form-select">
                    <option value="AGENT">Agent (Sales Pipeline &amp; Leads)</option>
                    <option value="ACCOUNTANT">Accountant (Collections &amp; Financial Ledger)</option>
                </select>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
            </div>

            <button type="submit" class="btn btn-ventriloc-primary w-100 py-2">Create Account</button>
        </form>

        <div class="text-center mt-3">
            <span class="ventriloc-subtext small">Already registered? </span>
            <a href="/login" class="small text-decoration-none" style="color: var(--color-ember-orange);">Sign in here</a>
        </div>
    </div>
</div>
</body>
</html>
