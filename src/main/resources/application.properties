spring.application.name=plot-lifecycle-prototype

# ---- Database (SQLite, a single file) ----
spring.datasource.url=jdbc:sqlite:${DB_PATH:realestate-prototype.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ---- Web ----
server.port=${PORT:8080}
# Trust X-Forwarded-* headers from the hosting platform's HTTPS proxy
server.forward-headers-strategy=framework
server.shutdown=graceful
server.compression.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
# Set COOKIE_SECURE=true once the app is served over HTTPS
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Templates are cached by default; set THYMELEAF_CACHE=false while editing pages locally
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# ---- Health checks (only /actuator/health is exposed) ----
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ---- App behaviour ----
# Allow visitors to create AGENT / ACCOUNTANT accounts at /register
app.registration-enabled=${ALLOW_REGISTRATION:true}
# Show the demo logins on the sign-in page (only sensible for a public demo with default passwords)
app.show-demo-credentials=${SHOW_DEMO_CREDENTIALS:false}

# Demo user passwords, used only when the database is first seeded.
seed.admin-password=${SEED_ADMIN_PASSWORD:admin123}
seed.agent-password=${SEED_AGENT_PASSWORD:agent123}
seed.accountant-password=${SEED_ACCOUNTANT_PASSWORD:accountant123}
